name: Bouw Stemstroom voor iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Kern testen, simulator bouwen en ongetekende IPA maken
        run: bash scripts/build-ios.sh

      - name: Installatiebestand bewaren
        uses: actions/upload-artifact@v7
        with:
          name: Stemstroom-iPhone-unsigned
          path: |
            build/Stemstroom-unsigned.ipa
            build/Stemstroom-unsigned.sha256
            build/build-info.txt
          if-no-files-found: error
          retention-days: 3

      - name: Echt startscherm vastleggen in iPhone-simulator
        id: simulator
        continue-on-error: true
        timeout-minutes: 7
        run: bash scripts/capture-simulator.sh

      - name: Simulatorschermafbeelding en rapport bewaren
        id: screenshot_artifact
        if: always() && steps.simulator.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Stemstroom-simulator
          path: build/screenshots/
          if-no-files-found: warn
          retention-days: 3

      - name: Simulatorresultaat vermelden
        if: always()
        env:
          CAPTURE_RESULT: ${{ steps.simulator.outcome }}
          UPLOAD_RESULT: ${{ steps.screenshot_artifact.outcome }}
        run: |
          printf 'Simulatoropname: %s. Screenshotartifact: %s.\n' "$CAPTURE_RESULT" "$UPLOAD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Dit is alleen het startscherm; microfoon, transcriptie en achtergrondduur zijn niet getest.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CAPTURE_RESULT" != 'success' ]; then
            printf '%s\n' '::warning::Geen geslaagde simulatoropname. Zie simulatorrapport; de IPA is afzonderlijk bewaard als de build slaagde.'
          fi

      - name: Bouw- en testuitvoer bewaren
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Stemstroom-bouwlog
          path: |
            build/logs/
            build/build-info.txt
          if-no-files-found: warn
          retention-days: 3
